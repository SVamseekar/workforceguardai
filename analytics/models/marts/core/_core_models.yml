version: 2

models:
  - name: dim_geography
    description: Common geography dimension for current Eurostat-backed WorkforceGuard models.
    columns:
      - name: geo_id
        tests:
          - unique
          - not_null

  - name: dim_sector
    description: Common sector dimension built from the current vacancy and pay-gap extracts.
    columns:
      - name: sector_id
        tests:
          - unique
          - not_null

  - name: fct_labour_market_region_sector
    description: Region and sector market signals aligned for WorkforceGuard analytics and API consumption.
    columns:
      - name: signal_id
        tests:
          - unique
          - not_null

  - name: mart_workforce_command_center
    description: Curated command-centre dataset for the dashboard and later AI recommendation layers.
    columns:
      - name: mart_row_id
        tests:
          - unique
          - not_null

  - name: mart_semantic_metrics
    description: Versioned semantic metric scores used by the dashboard and evidence-backed analyst layer.
    columns:
      - name: semantic_metric_id
        tests:
          - unique
          - not_null
      - name: metric_id
        tests:
          - not_null
      - name: metric_value
        description: >
          Nullable by design: a metric is left NULL (never fabricated as 0) when its
          underlying source data is missing, and implementation_status is set to
          'unavailable' for that row. See issue #79.
      - name: implementation_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['live', 'proxy_live', 'unavailable']
      - name: formula_version
        tests:
          - not_null
