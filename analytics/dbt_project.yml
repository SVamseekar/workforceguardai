name: workforceguard_analytics
version: 0.1.0
config-version: 2

profile: workforceguard_analytics

model-paths:
  - models
seed-paths:
  - seeds
macro-paths:
  - macros
test-paths:
  - tests

clean-targets:
  - target
  - dbt_packages

vars:
  eu_raw_path: "{{ env_var('WORKFORCEGUARD_EU_RAW_PATH', '/Users/souravamseekarmarti/Projects/WorkforceGuard-AI/data/eu_raw') }}"
  eu_meta_path: "{{ env_var('WORKFORCEGUARD_EU_META_PATH', '/Users/souravamseekarmarti/Projects/WorkforceGuard-AI/data/eu_meta') }}"
  internal_path: "{{ env_var('WORKFORCEGUARD_INTERNAL_PATH', '/Users/souravamseekarmarti/Projects/WorkforceGuard-AI/data/internal') }}"
  reference_path: "{{ env_var('WORKFORCEGUARD_REFERENCE_PATH', '/Users/souravamseekarmarti/Projects/WorkforceGuard-AI/data/reference') }}"
  public_company_path: "{{ env_var('WORKFORCEGUARD_PUBLIC_COMPANY_PATH', '/Users/souravamseekarmarti/Projects/WorkforceGuard-AI/data/public_company') }}"
  metric_registry_seed_version: "2026.03"
  # Set per dbt invocation (see RepositoryRegistry.tenant_schema_name and
  # main.py's upload_payroll route) to route internal-tagged models into a
  # tenant-specific DuckDB schema instead of the shared default schema.
  # Left unset, internal models fall back to the default schema — only
  # correct for a single-tenant/dev run.
  tenant_schema: null

models:
  workforceguard_analytics:
    staging:
      +materialized: view
      internal:
        +tags: ["internal"]
        # Internal models require tenant_schema — never build into shared main.
        +enabled: "{{ var('tenant_schema', none) is not none }}"
    marts:
      +materialized: table
      internal:
        +tags: ["internal"]
        +enabled: "{{ var('tenant_schema', none) is not none }}"

seeds:
  workforceguard_analytics:
    reference:
      +quote_columns: false
    governance:
      +quote_columns: false
