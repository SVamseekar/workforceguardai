# Local lab backend: Postgres + FastAPI on LAN.
# Frontend stays on the Mac (Vite). Do not use this file for production GCP.
#
# Usage (on the Dell, repo root):
#   copy .env.docker.example → .env.docker  (set SESSION_SECRET)
#   docker compose up --build -d
#   curl http://127.0.0.1:8001/health

services:
  postgres:
    # Prefer alpine tag when Desktop credential helper fails over SSH (image often already local).
    image: postgres:16-alpine
    container_name: wfg-postgres
    environment:
      POSTGRES_USER: wfg
      POSTGRES_PASSWORD: wfg_local
      POSTGRES_DB: workforceguard
    # Host access only on the Dell loopback (API container uses the service name).
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - wfg_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wfg -d workforceguard"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: dashboard/backend/Dockerfile
    container_name: wfg-api
    ports:
      # Reachable from the Mac over LAN (Vite proxy → this host:8001).
      - "8001:8080"
    env_file:
      - .env.docker
    environment:
      # Override/compose-network DB URL (service hostname is `postgres`).
      DATABASE_URL: postgresql://wfg:wfg_local@postgres:5432/workforceguard
      WORKFORCEGUARD_ROOT: /app_root
      WORKFORCEGUARD_DB_PATH: /app_root/data/workforceguard_analytics.duckdb
      WORKFORCEGUARD_EU_RAW_PATH: /app_root/data/eu_raw
      WORKFORCEGUARD_INTERNAL_PATH: /app_root/data/internal
      WORKFORCEGUARD_REFERENCE_PATH: /app_root/data/reference
      WORKFORCEGUARD_PUBLIC_COMPANY_PATH: /app_root/data/public_company
      PORT: "8080"
    volumes:
      - ./data:/app_root/data
      - ./analytics:/app_root/analytics
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  wfg_pg_data:
