name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache pre-commit
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        # Local-only: no-commit-to-branch (CI is detached HEAD / main).
        # History scan already runs as the dedicated Secret scan job.
        # Run against the PR/push diff, not the whole tree — existing files
        # are not rewritten.
        env:
          SKIP: no-commit-to-branch,gitleaks
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            pre-commit run --from-ref "origin/${{ github.base_ref }}" --to-ref HEAD --show-diff-on-failure
          elif [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            pre-commit run --from-ref "${{ github.event.before }}" --to-ref "${{ github.sha }}" --show-diff-on-failure
          else
            pre-commit run --all-files --show-diff-on-failure
          fi

  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      frontend: ${{ steps.filter.outputs.frontend }}
      analytics: ${{ steps.filter.outputs.analytics }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            python:
              - 'dashboard/backend/**'
              - 'scripts/**'
              - 'tests/**'
              - 'requirements*.txt'
              - 'data/**'
            frontend:
              - 'dashboard/frontend/**'
            analytics:
              - 'analytics/**'

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python:
    name: Python tests
    needs: changes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: workforceguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d workforceguard_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/workforceguard_test
      SESSION_SECRET: ci-secret-not-for-production-use-only
      PYTHONPATH: dashboard/backend
      WORKFORCEGUARD_DB_PATH: ${{ github.workspace }}/data/workforceguard_analytics.duckdb
      WORKFORCEGUARD_EU_RAW_PATH: ${{ github.workspace }}/data/eu_raw
      WORKFORCEGUARD_EU_META_PATH: ${{ github.workspace }}/data/eu_meta
      WORKFORCEGUARD_INTERNAL_PATH: ${{ github.workspace }}/data/internal
      WORKFORCEGUARD_REFERENCE_PATH: ${{ github.workspace }}/data/reference
      WORKFORCEGUARD_PUBLIC_COMPANY_PATH: ${{ github.workspace }}/data/public_company

    steps:
      # Skip LFS smudge: account LFS quota is exhausted and CI only needs
      # Parquet/CSV under data/ (xlsx reference inputs are not used in tests).
      - uses: actions/checkout@v7

      - name: Skip — no Python changes
        if: needs.changes.outputs.python != 'true'
        run: echo "No Python changes in this diff."

      - uses: actions/setup-python@v6
        if: needs.changes.outputs.python == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-data.txt
            dashboard/backend/requirements.txt

      - name: Install Python dependencies
        if: needs.changes.outputs.python == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-data.txt -r dashboard/backend/requirements.txt
          pip install pytest httpx

      - name: Build analytics database
        if: needs.changes.outputs.python == 'true'
        working-directory: analytics
        run: |
          dbt seed --profiles-dir .
          dbt run --profiles-dir . --exclude tag:internal

      - name: Run backend tests
        if: needs.changes.outputs.python == 'true'
        run: python -m pytest dashboard/backend/tests/ -q --tb=short

      - name: Run data pipeline tests
        if: needs.changes.outputs.python == 'true'
        run: python -m pytest tests/ -q --tb=short

  frontend:
    name: Frontend checks
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard/frontend

    steps:
      - uses: actions/checkout@v7

      - name: Skip — no frontend changes
        if: needs.changes.outputs.frontend != 'true'
        run: echo "No frontend changes in this diff."

      - uses: actions/setup-node@v6
        if: needs.changes.outputs.frontend == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/frontend/package-lock.json

      - name: Install dependencies
        if: needs.changes.outputs.frontend == 'true'
        run: npm ci

      - name: Lint
        if: needs.changes.outputs.frontend == 'true'
        run: npm run lint

      - name: Typecheck
        if: needs.changes.outputs.frontend == 'true'
        run: npm run typecheck

      - name: Unit tests
        if: needs.changes.outputs.frontend == 'true'
        run: npm test

      - name: Production build
        if: needs.changes.outputs.frontend == 'true'
        run: npm run build

  analytics:
    name: Analytics checks
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics

    env:
      WORKFORCEGUARD_DB_PATH: ${{ github.workspace }}/data/workforceguard_analytics.duckdb
      WORKFORCEGUARD_EU_RAW_PATH: ${{ github.workspace }}/data/eu_raw
      WORKFORCEGUARD_EU_META_PATH: ${{ github.workspace }}/data/eu_meta
      WORKFORCEGUARD_INTERNAL_PATH: ${{ github.workspace }}/data/internal
      WORKFORCEGUARD_REFERENCE_PATH: ${{ github.workspace }}/data/reference
      WORKFORCEGUARD_PUBLIC_COMPANY_PATH: ${{ github.workspace }}/data/public_company

    steps:
      - uses: actions/checkout@v7

      - name: Skip — no analytics changes
        if: needs.changes.outputs.analytics != 'true'
        run: echo "No analytics changes in this diff."

      - uses: actions/setup-python@v6
        if: needs.changes.outputs.analytics == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dashboard/backend/requirements.txt

      - name: Install dbt
        if: needs.changes.outputs.analytics == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install "dbt-core>=1.11.11,<2" "dbt-duckdb>=1.10.1,<2"

      - name: Parse and compile dbt project
        if: needs.changes.outputs.analytics == 'true'
        run: |
          dbt parse --profiles-dir .
          dbt compile --profiles-dir .
