name: Deploy WorkforceGuard

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-backend:
    name: Deploy backend to GCP VM
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GCP_VM_SSH_KEY }}

      - name: Deploy to VM
        env:
          VM_USER: ${{ secrets.GCP_VM_USER }}
          VM_IP: ${{ secrets.GCP_VM_IP }}
        run: |
          ssh -o StrictHostKeyChecking=no "${VM_USER}@${VM_IP}" \
            'set -euo pipefail
             cd ~/WorkforceGuard-AI
             git fetch origin main
             git reset --hard origin/main
             bash deploy/sync-production-env.sh || true
             bash deploy/install-service.sh
             docker build -t workforceguard-api:latest -f dashboard/backend/Dockerfile .
             echo "Image built. API is on-demand — run: bash deploy/gcp-service.sh start"'

  deploy-frontend:
    name: Deploy frontend to Vercel
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/frontend/package-lock.json

      - name: Install dependencies
        working-directory: dashboard/frontend
        run: npm ci

      - name: Deploy to Vercel
        working-directory: dashboard/frontend
        run: npx vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
