name: Deploy WorkforceGuard

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  GCP_PROJECT: workforceguard-prod
  GCP_ZONE: us-central1-f
  GCP_VM: workforceguard-vm

jobs:
  deploy-backend:
    name: Deploy backend to GCP VM
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Start VM if stopped
        run: |
          set -euo pipefail
          STATUS=$(gcloud compute instances describe "$GCP_VM" \
            --zone="$GCP_ZONE" --project="$GCP_PROJECT" --format='get(status)')
          if [ "$STATUS" != "RUNNING" ]; then
            echo "Starting $GCP_VM (was $STATUS)..."
            gcloud compute instances start "$GCP_VM" \
              --zone="$GCP_ZONE" --project="$GCP_PROJECT"
          fi

      - name: Resolve VM IP and wait for SSH
        id: vm
        run: |
          set -euo pipefail
          IP=$(gcloud compute instances describe "$GCP_VM" \
            --zone="$GCP_ZONE" --project="$GCP_PROJECT" \
            --format='get(networkInterfaces[0].accessConfigs[0].natIP)')
          echo "ip=$IP" >> "$GITHUB_OUTPUT"
          echo "VM IP: $IP"
          for attempt in $(seq 1 36); do
            if timeout 10 bash -c "echo > /dev/tcp/$IP/22" 2>/dev/null; then
              echo "SSH port open after ${attempt} attempt(s)"
              exit 0
            fi
            echo "Waiting for SSH on $IP (attempt $attempt/36)..."
            sleep 5
          done
          echo "SSH did not become reachable on $IP"
          exit 1

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.GCP_VM_SSH_KEY }}

      - name: Deploy to VM
        env:
          VM_USER: ${{ secrets.GCP_VM_USER }}
          VM_IP: ${{ steps.vm.outputs.ip }}
        run: |
          ssh -o StrictHostKeyChecking=no "${VM_USER}@${VM_IP}" \
            'set -euo pipefail
             cd ~/WorkforceGuard-AI
             git fetch origin main
             git reset --hard origin/main
             bash deploy/sync-production-env.sh || true
             bash deploy/ensure-postgres.sh
             bash deploy/install-service.sh
             docker build -t workforceguard-api:latest -f dashboard/backend/Dockerfile .
             bash deploy/migrate-legacy-data.sh
             sudo systemctl restart workforceguard-api
             for attempt in $(seq 1 30); do
               if curl -sf http://localhost:8080/health >/dev/null; then
                 echo "API healthy after ${attempt} attempt(s)"
                 exit 0
               fi
               echo "Waiting for API health (${attempt}/30)..."
               sleep 5
             done
             echo "API failed to become healthy"
             sudo journalctl -u workforceguard-api -n 30 --no-pager
             exit 1'

  deploy-frontend:
    name: Deploy frontend to Vercel
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Deploy to Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel@50.1.3 deploy --prod --yes --token "${{ secrets.VERCEL_TOKEN }}"

  verify-production:
    name: Verify production
    needs: [deploy-backend, deploy-frontend]
    if: ${{ always() && needs.deploy-backend.result == 'success' && needs.deploy-frontend.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Run production smoke checks
        env:
          API_DIRECT_IP: ${{ secrets.GCP_VM_IP }}
        run: bash deploy/verify-production.sh
