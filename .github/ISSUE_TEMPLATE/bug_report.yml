name: Bug report
description: Report something broken in WorkforceGuard
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Dashboard frontend
        - Backend API
        - Analytics / dbt
        - Auth / tenants
        - Deployment
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Environment
      placeholder: e.g. production, local dev, commit SHA
    validations:
      required: false
